<div class="flex flex-col gap-8">

  <div class="flex md:hidden flex-col items-center gap-3 mb-2 animate-fade-in text-text-primary transition-colors">
    <app-logo customClass="w-14 h-14"></app-logo>
    <h1 class="text-2xl font-bold tracking-tight">CrediCar</h1>
  </div>

  <div class="flex flex-col gap-2 items-center text-center">
    <h2 class="text-3xl font-bold text-text-primary">Bienvenido de nuevo</h2>
    <p class="text-text-secondary text-sm">Accede a la plataforma comercial de CrediCar.</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

    <app-input
      label="Correo corporativo"
      placeholder="asesor@concesionaria.com"
      [hasLeftIcon]="true"
      formControlName="email"
    >
      <svg left-icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    </app-input>

    <div class="flex flex-col gap-1">
      <app-input
        label="Contraseña"
        placeholder="Ingresa tu contraseña"
        [hasLeftIcon]="true"
        [isPassword]="true"
        formControlName="password"
      >
        <svg left-icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </app-input>
    </div>

    <div class="flex items-center justify-between">
      <app-checkbox label="Recordarme" formControlName="rememberMe"></app-checkbox>
      <a href="#" class="text-xs font-medium text-text-secondary hover:text-white transition-colors underline decoration-border-base underline-offset-4">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <app-button [fullWidth]="true" type="submit" [disabled]="loginForm.invalid">
      <span>Iniciar sesión</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </app-button>

    <div class="relative flex items-center justify-center py-2">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-border-base"></div>
      </div>
      <span class="relative px-4 bg-background text-[10px] uppercase tracking-widest text-text-muted font-bold">
        o continúa con
      </span>
    </div>

    <app-button variant="outline" [fullWidth]="true" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building2-icon lucide-building-2"><path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></svg>
      <span>Acceso corporativo (SSO)</span>
    </app-button>

    <div class="text-center mt-4">
      <p class="text-sm text-text-secondary">
        ¿No tienes una cuenta?
        <a routerLink="/register" class="text-white hover:text-accent font-medium transition-colors underline decoration-border-base underline-offset-4">
          Regístrate
        </a>
      </p>
    </div>

  </form>
</div>
