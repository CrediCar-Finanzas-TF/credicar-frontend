<div class="flex flex-col gap-8">

  <div class="flex md:hidden flex-col items-center gap-3 mb-2 animate-fade-in text-text-primary transition-colors">
    <app-logo customClass="w-14 h-14"></app-logo>
    <h1 class="text-2xl font-bold tracking-tight">CrediCar</h1>
  </div>

  <div class="flex flex-col gap-2 items-center text-center">
    <h2 class="text-3xl font-bold text-text-primary">Crear cuenta</h2>
    <p class="text-text-secondary text-sm">Registra tu acceso corporativo para ingresar a CrediCar</p>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">

    <app-input
      label="Nombre completo"
      placeholder="Ej: Alexander Junior Aquino Perez"
      [hasLeftIcon]="true"
      formControlName="fullName"
    >
      <svg left-icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </app-input>

    <app-input
      label="Correo corporativo"
      placeholder="alexandersoviet@empresa.com"
      [hasLeftIcon]="true"
      formControlName="email"
    >
      <svg left-icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    </app-input>

    <app-input
      label="Contraseña"
      placeholder="••••••••••••"
      [hasLeftIcon]="true"
      [isPassword]="true"
      formControlName="password"
    >
      <svg left-icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </app-input>

    <app-input
      label="Confirmar contraseña"
      placeholder="••••••••••••"
      [hasLeftIcon]="true"
      [isPassword]="true"
      formControlName="confirmPassword"
    >
      <svg left-icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </app-input>

    <div class="mt-2">
      <app-checkbox
        label="Acepto los Términos y Condiciones y la Política de Privacidad"
        formControlName="terms">
      </app-checkbox>
    </div>

    <app-button [fullWidth]="true" type="submit" [disabled]="registerForm.invalid" class="mt-2">
      <span>Crear cuenta</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </app-button>

    <div class="text-center mt-2">
      <p class="text-sm text-text-secondary">
        ¿Ya tienes una cuenta?
        <a routerLink="/login" class="text-white hover:text-accent font-medium transition-colors underline decoration-border-base underline-offset-4">
          Iniciar sesión
        </a>
      </p>
    </div>

  </form>
</div>
