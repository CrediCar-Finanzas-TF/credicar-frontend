<div class="flex flex-col gap-8 animate-fade-in w-full max-w-7xl mx-auto">

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

    <app-metric-card title="Clientes Totales" [value]="totalClients()">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    </app-metric-card>

    <app-metric-card title="Clientes Cotizados" [value]="quotedClientsCount">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/></svg>
    </app-metric-card>

    <app-metric-card title="Simulaciones Activas" [value]="activeSimulationsCount">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
    </app-metric-card>

    <app-metric-card title="Monto Total Financiado" [value]="totalFinancedAmount">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
    </app-metric-card>

  </div>

  <div class="flex flex-col gap-6">

    <div class="w-full md:w-96">
      <app-input
        placeholder="Buscar por nombre, DNI o teléfono..."
        [hasLeftIcon]="true"
        [(ngModel)]="searchQuery"
      >
        <svg left-icon xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </app-input>
    </div>

    <app-data-table
      [columns]="cols"
      [data]="rows()"
      [totalItems]="quotedClientsCount"
      itemName="clientes cotizados"
      [isLoading]="isLoading()"
      [showPagination]="false"
      [rowsLimit]="50"
    >
      <ng-template #bodyTpl let-row let-col="col">

        @if (col.field === 'client') {
          <div class="flex items-center gap-3">
            <app-chip [initials]="row.initials"></app-chip>
            <span class="text-sm font-medium text-text-primary">{{ row.name }}</span>
          </div>
        }

        @else if (col.field === 'status') {
          <app-badge>{{ row.status }}</app-badge>
        }

        @else if (col.field === 'actions') {
          <div class="flex items-center justify-end gap-1">
            <button
              type="button"
              (click)="viewSchedule(row)"
              class="text-text-muted hover:text-text-primary transition-colors focus:outline-none p-1.5"
              title="Ver cronograma"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            </button>
            <button
              type="button"
              (click)="openEditDrawer(row.client)"
              class="text-text-muted hover:text-text-primary transition-colors focus:outline-none p-1.5"
              title="Editar cliente"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            </button>
          </div>
        }

        @else {
          <span class="text-sm text-text-secondary">{{ row[col.field] }}</span>
        }

      </ng-template>
    </app-data-table>
  </div>
</div>

<app-drawer [isOpen]="isEditDrawerOpen()" (close)="closeEditDrawer()">
  <div class="flex flex-col h-full">
    <div class="flex-1 overflow-y-auto p-6">
      <app-client-form title="Editar cliente" (continue)="onClientFormSubmit($event)"></app-client-form>

      @if (editErrorMessage()) {
        <p class="text-sm text-danger mt-4">{{ editErrorMessage() }}</p>
      }
    </div>

    <div class="p-6 border-t border-border-base">
      <app-button [fullWidth]="true" [disabled]="isSavingEdit()" (click)="onSaveEdit()">
        {{ isSavingEdit() ? 'Guardando...' : 'Guardar cambios' }}
      </app-button>
    </div>
  </div>
</app-drawer>
