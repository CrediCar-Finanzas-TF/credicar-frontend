<div class="flex flex-col gap-8 animate-fade-in w-full max-w-7xl mx-auto">

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

    <app-metric-card title="Clientes Totales" value="1,284">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    </app-metric-card>

    <app-metric-card title="Nuevos Este Mes" value="42">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/></svg>
    </app-metric-card>

    <app-metric-card title="Simulaciones Activas" value="18">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
    </app-metric-card>

    <app-metric-card title="Seguimiento" value="9">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
    </app-metric-card>

  </div>

  <div class="flex flex-col gap-6">

    <div class="w-full md:w-96">
      <app-input
        placeholder="Buscar por nombre, DNI o teléfono..."
        [hasLeftIcon]="true"
        [(ngModel)]="searchQuery"
      >
        <svg left-icon xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </app-input>
    </div>

    <div class="bg-surface border border-border-base p-6 rounded-none shadow-sm flex flex-col w-full overflow-x-auto transition-colors duration-300">

      <table class="table-dark w-full min-w-[800px]">
        <thead>
        <tr>
          <th class="text-left">Cliente</th>
          <th class="text-left">DNI</th>
          <th class="text-left">Teléfono</th>
          <th class="text-left">Estado</th>
          <th class="text-left">Última Actualización</th>
        </tr>
        </thead>
        <tbody>
          @for (client of clients; track $index) {
            <tr>
              <td>
                <div class="flex items-center gap-3">
                  <app-chip [initials]="client.initials"></app-chip>
                  <span class="text-sm font-medium text-text-primary">{{ client.name }}</span>
                </div>
              </td>
              <td>
                <span class="text-sm text-text-secondary">{{ client.dni }}</span>
              </td>
              <td>
                <span class="text-sm text-text-secondary">{{ client.phone }}</span>
              </td>
              <td>
                <app-badge>{{ client.status }}</app-badge>
              </td>
              <td>
                <span class="text-[11px] font-semibold text-text-muted tracking-wider uppercase">{{ client.lastUpdate }}</span>
              </td>
            </tr>
          }
        </tbody>
      </table>

      <div class="flex items-center justify-between mt-4 pt-5 border-t border-border-base/40">
        <span class="text-xs text-text-muted font-medium">Mostrando 1 a 6 de 1,284 clientes</span>

        <div class="flex items-center gap-2">
          <button class="w-8 h-8 flex items-center justify-center border border-border-base bg-transparent text-text-secondary hover:text-white hover:border-border-strong transition-colors rounded-none focus:outline-none disabled:opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>

          <button class="w-8 h-8 flex items-center justify-center border border-border-base bg-transparent text-text-secondary hover:text-white hover:border-border-strong transition-colors rounded-none focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
