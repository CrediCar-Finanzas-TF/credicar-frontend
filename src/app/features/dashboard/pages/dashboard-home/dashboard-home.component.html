<div class="flex flex-col gap-6 animate-fade-in w-full max-w-7xl mx-auto pb-8">

  <app-welcome-banner [userName]="authService.currentUser()?.fullName ?? 'Usuario'"></app-welcome-banner>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    <app-metric-card title="Simulaciones Hoy" value="12">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
    </app-metric-card>

    <app-metric-card title="Créditos Aprobados" value="5">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>
    </app-metric-card>

    <app-metric-card title="Monto Financiado" value="S/ 420K">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
    </app-metric-card>

    <app-metric-card title="Nuevos Clientes" value="38">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
    </app-metric-card>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="lg:col-span-2 flex flex-col">
      <app-activity-table class="flex-1 flex flex-col"></app-activity-table>
    </div>

    <div class="flex flex-col gap-6">
      <div class="flex-1">
        <app-pending-operations></app-pending-operations>
      </div>

      <div class="bg-surface border border-border-base p-4 flex items-center gap-4 overflow-hidden text-sm text-text-secondary h-[52px]">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-text-muted"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>

        <div class="relative flex-1 overflow-hidden h-full flex items-center">
          <div class="marquee-container w-full">
            <span class="mr-10 font-medium">TCEA Ref: <span class="text-text-primary font-bold">14.5%</span></span>
            <span class="mr-10">Aprobaciones automáticas activas</span>
            <span class="mr-10 text-warning">Mantenimiento de sistema a las 23:00 hrs</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
