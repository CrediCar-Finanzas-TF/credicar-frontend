<div class="flex flex-col gap-8 animate-fade-in w-full max-w-7xl mx-auto">

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

    <app-metric-card title="Operaciones Activas" value="1,284">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    </app-metric-card>

    <app-metric-card title="Créditos Aprobados" value="5">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>
    </app-metric-card>

    <app-metric-card title="Monto Financiado" value="S/ 420 K">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
    </app-metric-card>

    <app-metric-card title="Seguimiento" value="9">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
    </app-metric-card>

  </div>

  <div class="flex flex-col gap-6">

    <div class="w-full md:w-96">
      <app-input
        placeholder="Buscar por código o cliente..."
        [hasLeftIcon]="true"
        [(ngModel)]="searchQuery"
      >
        <svg left-icon xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </app-input>
    </div>

    <app-data-table
      [columns]="cols"
      [data]="operations"
      [totalItems]="1284"
      itemName="operaciones"
      [isLoading]="false"
    >
      <ng-template #bodyTpl let-row let-col="col">

        @if (col.field === 'code') {
          <span class="text-sm font-medium text-text-secondary">{{ row.code }}</span>
        }

        @else if (col.field === 'client') {
          <div class="flex items-center gap-3">
            <app-chip [initials]="getInitials(row.client)"></app-chip>
            <span class="text-sm font-medium text-text-primary">{{ row.client }}</span>
          </div>
        }

        @else if (col.field === 'status') {
          <app-badge>{{ row.status }}</app-badge>
        }

        @else if (col.field === 'lastUpdate') {
          <span class="text-[11px] font-semibold text-text-muted tracking-wider uppercase">{{ row.lastUpdate }}</span>
        }

        @else {
          <span class="text-sm text-text-secondary">{{ row[col.field] }}</span>
        }

      </ng-template>
    </app-data-table>

  </div>
</div>
